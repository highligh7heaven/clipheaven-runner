name: Check my setup

# Tests every key and login ClipHeaven needs and says exactly how to fix
# anything that's wrong. It only reads; it doesn't make clips or use up the
# free AI allowance. GitHub app → Actions → Check my setup → Run workflow.
on:
  workflow_dispatch:

permissions:
  contents: write  # saves the results for the dashboard's setup checklist (dashboard-data branch)

jobs:
  check:
    name: Check my setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the ClipHeaven code
        uses: actions/checkout@v4
        with:
          repository: highligh7heaven/clip-bot
          ref: main
          token: ${{ secrets.CODE_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check everything
        run: |
          pip install -q requests tzdata numpy cryptography
          python -m clipheaven.check_setup
        env:
          PYTHONTZPATH: ""
          PYTHONUNBUFFERED: "1"
          CLIPHEAVEN_RUNNER: github
          TIME_ZONE: ${{ vars.TIME_ZONE }}
          CLIPHEAVEN_LICENSE: ${{ secrets.CLIPHEAVEN_LICENSE }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SETTINGS_SHEET_URL: ${{ secrets.SETTINGS_SHEET_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
