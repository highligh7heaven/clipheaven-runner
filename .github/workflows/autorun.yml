name: Automatic runs

# Every 2 hours, checks the hours you picked on the dashboard (Settings →
# Automatic runs) and starts ClipHeaven if one of them has come round since the
# last check (so a 7:00 run starts at the 8:00 check); also sends
# "time to post" reminders at the hours picked under Notifications, the morning
# summary, and (every couple of hours) who's hot on Twitch. Takes a few
# seconds; does nothing while automatic runs are off.
on:
  schedule:
    - cron: "3 */2 * * *"  # a few minutes past every other hour (GitHub may start it a little late).
                           # Each check costs at least 1 free GitHub minute, so every 2 hours saves ~360 a month.
  workflow_dispatch:  # "Run workflow" by hand: also refreshes who's hot straight away

concurrency:
  group: autorun
  cancel-in-progress: false

permissions:
  actions: write   # to start the ClipHeaven workflow
  contents: write  # reads the dashboard's settings.json, saves YouTube stats for the Stats tab

env:
  HAS_PUSH_KEY: ${{ secrets.VAPID_PRIVATE_KEY != '' }}
  CHECK_EVERY_HOURS: "2"  # keep in step with the cron line above

jobs:
  check:
    name: Check the time
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Get the ClipHeaven code
        uses: actions/checkout@v4
        with:
          repository: highligh7heaven/clip-bot
          ref: main
          token: ${{ secrets.CODE_TOKEN }}
          persist-credentials: false
          sparse-checkout: clipheaven

      - name: Get what app notifications need
        if: ${{ env.HAS_PUSH_KEY == 'true' }}
        run: python3 -m pip install -q --user --break-system-packages requests cryptography || python3 -m pip install -q --user requests cryptography

      - name: Start a run if it's time
        run: python3 -m clipheaven.autorun
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}  # for "time to post" reminders
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}  # optional: reminders straight to the ClipHeaven app
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}  # optional: your channel's views on the Stats tab
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}  # for "Hot right now" on the dashboard
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
