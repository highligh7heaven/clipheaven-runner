name: Fix a clip

# Started by the dashboard's "Use this title" button: gives one finished clip
# a different title box and puts it back in the same Google Drive file.
on:
  workflow_dispatch:
    inputs:
      file_id:
        description: "The clip's Google Drive file id"
        required: true
      title:
        description: "The new title (blank = keep it)"
        required: false
        default: ""
      box:
        description: "Where the old title box is: x,y,width,height"
        required: false
        default: ""
      trim_start:
        description: "Seconds to cut off the start (0-10)"
        required: false
        default: "0"
      trim_end:
        description: "Seconds to cut off the end (0-10)"
        required: false
        default: "0"
      old_title:
        description: "The old title (to rename the file)"
        required: false
        default: ""

concurrency:
  group: retitle-${{ inputs.file_id }}
  cancel-in-progress: false

permissions:
  contents: write  # updates the dashboard's status.json

jobs:
  retitle:
    name: Swap title
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLIPHEAVEN_RUNNER: github
      PYTHONUNBUFFERED: "1"
      RETITLE_FILE: ${{ inputs.file_id }}
      RETITLE_TEXT: ${{ inputs.title }}
      RETITLE_BOX: ${{ inputs.box }}
      RETITLE_OLD: ${{ inputs.old_title }}
      RETITLE_TRIM_START: ${{ inputs.trim_start }}
      RETITLE_TRIM_END: ${{ inputs.trim_end }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Get the ClipHeaven code
        uses: actions/checkout@v4
        with:
          repository: highligh7heaven/clip-bot
          ref: main
          token: ${{ secrets.CODE_TOKEN }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core fonts-noto-color-emoji > /dev/null
          pip install -q requests numpy pillow emoji google-api-python-client google-auth

      - name: Swap the title
        run: python -m clipheaven.retitle
